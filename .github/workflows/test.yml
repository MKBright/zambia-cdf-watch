name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: JavaScript and Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run JavaScript tests
        run: node --test

      - name: Run Python tests
        run: python -m unittest tests/test_csv_to_json.py
